spring:
  datasource:
    url: jdbc:h2:mem:evops_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 既有业务用例不携带令牌：测试环境关闭 Shiro JWT 鉴权（过滤链全放行）。
# 认证全链路用例在类上用 @TestPropertySource 单独打开 auth.enabled=true。
auth:
  enabled: false
  jwt:
    # 测试专用固定密钥（Base64，解码 38 字节），仅测试库使用
    secret: ZGV2LW9ubHktZXZvcHMtand0LXNlY3JldC1rZXktMzJieXRlcyE=
    access-ttl-minutes: 120
    refresh-ttl-hours: 168

reconcile:
  scheduling-enabled: false
  tolerance: 0.05
  engine-mode: PARALLEL
  cutover-batch-size: 2

booking:
  # 用例直接调服务触发过期释放，不依赖真实定时
  scheduling-enabled: false
  mode: NEW
  buffer-minutes: 18
  lock-ttl-minutes: 35

photo:
  # 测试落盘到临时目录，各用例类自分子目录，跑完即弃
  root-dir: ${java.io.tmpdir}/evops-photo-test
  thumb-max-side: 300
  allowed-types: jpg,jpeg,png
  max-file-size: 20971520
